<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ยืดดี หลังร้าน</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Bai+Jamjuree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .login{display:flex;gap:8px;flex-wrap:wrap}
  .login input,.orders select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
  .stats{display:flex;flex-wrap:wrap;gap:24px}
  .stats b{display:block;font-family:var(--display);font-size:1.6rem;font-weight:500;font-variant-numeric:tabular-nums}
  .stats span{color:var(--muted);font-size:.85rem}
  .orders{display:flex;flex-direction:column;gap:10px}
  .order{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 16px}
  .order h3{font-size:1rem;font-family:var(--body)}
  .order .who{color:var(--muted);font-size:.88rem;white-space:pre-line}
  .order ul{margin:0;padding-left:18px;font-size:.9rem}
  .order .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-variant-numeric:tabular-nums}
  .pill{font-size:.78rem;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
  .pill.wait{color:var(--danger)} .pill.paid{color:var(--cobalt)} .pill.sent{color:var(--ok)} .pill.cancel{color:var(--muted)}
  @media (max-width:560px){.order{grid-template-columns:1fr}.order .side{align-items:flex-start}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><a class="logo" href="/">ยืดดี<small>หลังร้าน</small></a></div></header>
<main class="wrap">
  <form class="login" id="login">
    <input id="key" type="password" placeholder="รหัสแอดมิน" aria-label="รหัสแอดมิน">
    <button class="btn">ดูออเดอร์</button>
  </form>
  <p class="err" id="err" hidden></p>
  <section class="stats" id="stats" hidden></section>
  <section class="orders" id="orders"></section>
</main>
<script src="shirt.js"></script>
<script>
const $ = id => document.getElementById(id);
const baht = n => "฿" + n.toLocaleString("th-TH");
const PILL = { "รอชำระเงิน": "wait", "รอจัดส่ง": "paid", "จัดส่งแล้ว": "sent", "ยกเลิก": "cancel" };
let key = "";
try { key = sessionStorage.getItem("yuetdee.admin") || ""; } catch (e) {}

async function api(method, path, body) {
  const res = await fetch("/api/orders" + path, {
    method, headers: { "Content-Type": "application/json", "X-Admin-Key": key },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้");
  return data;
}

async function load() {
  try {
    const { orders, statuses } = await api("GET", "");
    $("err").hidden = true;
    $("login").hidden = true;
    try { sessionStorage.setItem("yuetdee.admin", key); } catch (e) {}
    render(orders, statuses);
  } catch (e) {
    $("err").textContent = e.message;
    $("err").hidden = false;
  }
}

function render(orders, statuses) {
  const live = orders.filter(o => o.status !== "ยกเลิก");
  const count = s => orders.filter(o => o.status === s).length;
  $("stats").hidden = false;
  $("stats").innerHTML = `
    <div><b>${baht(live.reduce((s, o) => s + o.total, 0))}</b><span>ยอดขายรวม</span></div>
    <div><b>${live.reduce((s, o) => s + o.items.reduce((a, i) => a + i.qty, 0), 0)}</b><span>ตัวที่ขายได้</span></div>
    <div><b>${count("รอชำระเงิน")}</b><span>รอชำระเงิน</span></div>
    <div><b>${count("รอจัดส่ง")}</b><span>รอจัดส่ง</span></div>`;
  $("orders").innerHTML = orders.length ? orders.map(o => `
    <article class="order">
      <div>
        <h3><span class="mono">${o.id}</span> · ${esc(o.name)} <span class="pill ${PILL[o.status]}">${o.status}</span></h3>
        <div class="who">${esc(o.phone)} · ${new Date(o.createdAt * 1000).toLocaleString("th-TH")}
${esc(o.address)} ${o.postcode}${o.note ? "\nหมายเหตุ: " + esc(o.note) : ""}</div>
        <ul>${o.items.map(i => `<li>${esc(i.name)} ${esc(i.color)} ${i.size} × ${i.qty}</li>`).join("")}</ul>
      </div>
      <div class="side">
        <b>${baht(o.total)}</b>
        <span class="muted small">${o.payment === "cod" ? "ปลายทาง" : "พร้อมเพย์"}</span>
        <select data-id="${o.id}" aria-label="สถานะ">${statuses.map(s => `<option${s === o.status ? " selected" : ""}>${s}</option>`).join("")}</select>
      </div>
    </article>`).join("") : '<p class="muted">ยังไม่มีออเดอร์</p>';
}

$("login").addEventListener("submit", e => { e.preventDefault(); key = $("key").value; load(); });
$("orders").addEventListener("change", async e => {
  if (!e.target.dataset.id) return;
  try { await api("PATCH", "/" + e.target.dataset.id, { status: e.target.value }); load(); }
  catch (err) { $("err").textContent = err.message; $("err").hidden = false; }
});
if (key) load();
</script>
</body>
</html>
